name: Bug report
description: Something in CyberCheck does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through private reporting instead (see SECURITY.md).

        **Before posting logs or screenshots, remove secrets** (API keys, tokens, passwords, VPN keys,
        `DATABASE_URL`), your own hostnames and IP addresses, and any personal data. Defang phishing URLs:
        `hxxps://example[.]com`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CT ingest / scoring
        - Enrichment (DNS, RDAP, ASN)
        - Page fetcher / VPN / sandbox
        - AI judge / budget
        - Reporting
        - Blocklist
        - CZDS
        - Telegram bot
        - Dashboard
        - Docs / setup
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you run (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker and Compose versions, Postgres version, and which optional parts you run (fetcher, AI, CZDS, bot).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs <service>`, with secrets and personal data removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets, private hostnames and IP addresses, and personal data from everything above.
          required: true
