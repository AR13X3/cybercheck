# CyberCheck brand watchlist: Australia.
#
# keywords        distinctive tokens (>= 4 chars) matched anywhere in a hostname, plus typo
#                 variants for keywords of 6+ chars.
# short_tokens    ambiguous tokens (anz, nab, ato...) that appear inside ordinary words.
#                 They only count as a whole token ("anz-verify") or glued to a bait word
#                 ("nablogin", "mynab"), and only with bait/AU context.
# needs_context   keyword is also a place name / foreign brand (bendigo, medicare, kmart...):
#                 without a bait word or AU context it scores low and is not stored.
# official_domains  registrable domains the brand itself uses. These are never flagged.
#                 Draft entries are being verified (docs/research/au-watchlist.md).
# exclude         substrings that mean "not this brand" (e.g. linktree for linkt).

# Merged 2026-11-16 with the verified research in docs/research/au-watchlist.{md,yaml}.
# official_domains contain only verified domains (plus a few well-known subsidiaries).

