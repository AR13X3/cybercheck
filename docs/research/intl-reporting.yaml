  - id: apwg_ecx
    name: APWG eCrime eXchange (eCX) API
    automated_ok: true
    verified: true
    eligibility_cost: >-
      Members only. Annual dues in USD: Premium $15,000, Sponsoring $7,500, Corporate $5,000,
      Individual Corporate $2,500, Accredited Reporter $1,500. Apply by emailing
      membership@apwg.org from the organisation's own email domain (webmail such as Gmail,
      Yahoo, Protonmail, GMX and Tuta "cannot be considered"). Then come a data sharing
      agreement, an invoice and an eCX invitation. Discounts are "sometimes" offered to
      non-profits, academics, government, law enforcement and NGOs. Accredited Reporter,
      Individual Corporate and Corporate members can only "View only your eCX submitted phishing
      URL data". The Phish Data Module is for Premium and Sponsoring members only.
    endpoint: https://ecrimex.net/api/v1/phish
    sandbox_endpoint: https://sandbox.ecx2.ecrimex.net/api/v1/phish
    method: POST, application/json
    auth: 'HTTP header "Authorization: Bearer <api_key>"'
    payload_example: |
      {
        "url": "https://parcel-redelivery.example/au/track",
        "brand": "Australia Post",
        "discoveredAt": 1794700000,
        "status": "active",
        "confidence": 90,
        "ip": ["192.0.2.10"],
        "asn": [64500]
      }
    status_check: >-
      GET /phish/{id}, GET /phish/search, or GET /phish (up to 10,000 latest). There are also
      /malicious-domain (with notes), /malicious-sms and /report-phishing modules.
    rate_limits: not published in the OpenAPI spec
    evidence_expected: url and confidence (required); brand, discoveredAt, status, ip[], asn[]
    terms_notes: >-
      OpenAPI 3.1.0, info.version 1.1.2. The default branch is main; master has the same
      content. The inline POST /phish schema uses "discoveredAt", but the PhishPostBody
      component names it "disc". Confirm in the sandbox. Support contact: support@ecrimex.net.
    source:
      - https://apwg.org/membership/
      - https://apwg.org/ecx/
      - https://raw.githubusercontent.com/APWG/ecx2-openapi-doc/main/ecx2-openapi.yaml

