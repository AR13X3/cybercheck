  - id: urlscan_io
    name: urlscan.io (optional third-party evidence, not a takedown channel)
    automated_ok: true
    verified: partial
    endpoint: https://urlscan.io/api/v1/scan/
    method: POST, application/json
    auth: 'HTTP header "API-Key: <key>" (free account). "Unauthenticated users only receive minor quotas for API calls."'
    payload_example: |
      {"url": "https://parcel-redelivery.example/au/track", "visibility": "unlisted", "tags": ["phishing", "au-brand"]}
    status_check: >-
      GET https://urlscan.io/api/v1/result/{uuid}/ with polling and exponential backoff. Check
      quotas with GET https://urlscan.io/api/v1/quotas. (The researcher's "10 s then every 2 s"
      polling advice and the customagent and referer field names were not re-verified.)
    rate_limits: >-
      Free plan, per day: 50 private, 1,000 unlisted and 5,000 public scans, 1,000 searches and
      10,000 result requests. Separate per-minute and per-hour windows also apply. Read the
      X-Rate-Limit-Scope, -Action, -Window, -Limit, -Remaining, -Reset and -Reset-After headers.
    terms_notes: >-
      On the free plan, country selection works for public scans only (paid plans: all scans).
      Unlisted scans are reportedly visible only to the submitter and urlscan Pro users; this
      was not read directly (it came from a search extract). ToS (last updated 2020-07-22): a
      licence "solely for your personal, non-commercial use", and "Commercial use ... requires
      express written permission". Best practice is to search before scanning again and to
      submit URLs containing personal data as Unlisted.
    source:
      - https://urlscan.io/pricing/
      - https://docs.urlscan.io/pages/api-rate-limits
      - https://docs.urlscan.io/pages/api-best-practices
      - https://docs.urlscan.io/pages/api-intro
      - https://urlscan.io/terms/

  - id: registrar_abuse_contact_gtld
    name: gTLD registrar abuse contact (from RDAP)
    automated_ok: false
    verified: true
    endpoint: >-
      Abuse email taken from the registry RDAP: the entity with role "registrar", then its nested
      entity with role "abuse", then the vCard "email".
    method: email or registrar webform
    auth: none
    payload_example: |
      Subject: Phishing (DNS Abuse) report: <domain> impersonating <Australian brand>
      Body: domain and full URLs, first-seen time (UTC) and CT log entry, a screenshot, the brand
      impersonated and its official domain, how to reproduce (AU IP and mobile UA if cloaked),
      resolving IPs and ASN, and the reporter's contact details. Cite RAA 3.18.1 and 3.18.2.
    status_check: >-
      Under RAA 3.18.1 the registrar must confirm receipt. Measure takedown by polling the RDAP
      "status" array (RFC 8056 strings such as "client hold" and "server hold", not
      clientHold or serverHold), plus DNS resolution and HTTP reachability.
    rate_limits: n/a
    terms_notes: >-
      A human abuse desk, so it goes in the human-review queue. Escalate unresolved cases through
      the ICANN Compliance "abuse involving a domain name" complaint form after a reasonable time.
    source:
      - https://itp.cdn.icann.org/en/files/accredited-registrars/registrar-accreditation-agreement-global-amendment-05apr24-en.htm
      - https://www.icann.org/dnsabuse
      - https://www.icann.org/compliance/complaint

  - id: registrar_abuse_contact_au
    name: .au registrar abuse contact
    automated_ok: false
    verified: partial
    endpoint: >-
      The registrar named in the .au registry data, looked up by a human at review time. Do NOT
      look it up automatically: auDA WHOIS Policy clause 5.1(a) prohibits "use of WHOIS data to
      support an automated electronic query process", and RDAP is part of the WHOIS service
      (clause 2.1).
    method: email or registrar webform
    auth: none
    payload_example: same evidence as the gTLD report
    status_check: manual, or low-volume RDAP status checks only if auDA confirms they are acceptable
    rate_limits: >-
      auDA "will impose restrictions on the number of queries" (clause 5.2). rdap.cctld.au
      returned HTTP 429 (Cloudflare 1015) on the first request from the test host on 2026-11-15.
    terms_notes: >-
      2025 Registrar Agreement clause 14.8(c) duties (confirm, investigate, mitigate on
      actionable evidence) apply to reports received "via the DNS Abuse Contact", which is
      nominated between auDA and the registrar in Schedule 1. Whether public reporters can rely
      on it is unconfirmed. RDAP abuse email availability is also unconfirmed: Schedule A lists
      the Registrar Abuse Contact Email, but clause 4.4 says all emails were removed from RDAP.
    source:
      - https://www.auda.org.au/au-domain-names/au-rules-and-policies/whois-policy-2025-11/
      - https://files.auda.org.au/documents/WHOIS-Policy-June-2026.pdf
      - https://files.auda.org.au/documents/2025-Registrar-Agreement.pdf

