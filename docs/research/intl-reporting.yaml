  - id: cloudflare_abuse_reports_api
    name: Cloudflare Abuse Reports API
    automated_ok: conditional
    verified: true
    endpoint: https://api.cloudflare.com/client/v4/accounts/{account_id}/abuse-reports/{report_param}
    method: POST, application/json
    auth: >-
      API token with "Trust and Safety Write", plus the abuse-reports entitlement. "Enterprise
      accounts have it by default; other accounts must request access." Without it the request
      fails with HTTP 401.
    payload_example: |
      {
        "act": "abuse_phishing",
        "name": "CyberCheck abuse desk",
        "email": "reports@cybercheck.example",
        "email2": "reports@cybercheck.example",
        "urls": "https://parcel-redelivery.example/au/track\nhttps://parcel-redelivery.example/au/pay",
        "justification": "Phishing page impersonating Australia Post; collects card details. Geofenced: visible only from Australian IPs with a mobile user agent.",
        "host_notification": "send",
        "owner_notification": "send-anon",
        "reported_country": "AU",
        "reported_user_agent": "Mozilla/5.0 (iPhone; ...)",
        "original_work": "https://auspost.com.au/"
      }
    response_example: '{"abuse_rand": "<report id>", "request": {"act": "abuse_phishing"}, "result": "success"}'
    status_check: >-
      GET /accounts/{account_id}/abuse-reports/submitted, /abuse-reports/submitted/{report_id}
      and /abuse-reports/submitted/{report_id}/emails. denial_reason values: unable_to_confirm,
      incomplete_report, not_on_cloudflare, duplicate_report, content_removed,
      report_details_mismatch, no_abuse_found, missing_original_work, direct_url_required,
      wrong_report_category, content_unavailable, law_enforcement_referral_required,
      domain_dispute_process_required.
    rate_limits: not stated on the API page
    evidence_expected: >-
      Required for abuse_phishing: email, email2, name (max 255), urls (max 250, unique, same
      hostname, newline-separated), justification (20 to 5000 characters: access details and
      steps to view the content), host_notification and owner_notification (send or send-anon;
      "none" is not accepted for phishing). Optional: comments (1 to 2000), company (100),
      original_work (255), reported_country (2 characters), reported_user_agent (255), tele (20)
      and title (255).
    terms_notes: >-
      name, urls, email, company and tele "may be released by Cloudflare to third parties such as
      the Lumen Database". Use owner_notification "send-anon". UNVERIFIED: the accepted values of
      the {report_param} path segment (documented only as "The report type for submitted
      reports"; presumably the same as act).
    source:
      - https://developers.cloudflare.com/api/resources/abuse_reports/methods/create/
      - https://developers.cloudflare.com/api/resources/abuse_reports/

