channels:
  - id: netcraft
    name: Netcraft Report API v3
    automated_ok: true
    verified: true
    endpoint: https://report.netcraft.com/api/v3/report/urls
    sandbox_endpoint: https://report.netcraft.com/api/v3/test/report/urls
    method: POST, Content-Type application/json
    auth: >-
      No API key. POST /report/urls declares no security, and the spec defines no
      securitySchemes. Only the GET /tags/file, /tags/mail and /tags/url endpoints declare
      "BearerAuth", which is undefined. The required "email" field gets the analysis result.
      The optional "source" (UUID) applies only if Netcraft has issued one. 401 and 403 are
      listed as possible responses, but nothing says when they occur.
    payload_example: |
      {
        "email": "reports@cybercheck.example",
        "reason": "Newly registered lookalike domain found in CT logs; impersonates an Australian brand",
        "skip_invalid_urls": true,
        "urls": [
          {
            "url": "https://parcel-redelivery.example/au/track",
            "country": "AU",
            "reason": "Impersonates Australia Post redelivery page and asks for card details",
            "screenshot": {"base64": "<base64 PNG>", "ext": "png"}
          }
        ]
      }
    response_example: |
      200 {"message": "Successfully reported", "uuid": "<32-hex submission uuid>", "invalid_urls": ["..."]}
      400 ErrorModel (invalid or missing parameters)
      429 "Too many urls reported. We employ rate limiting to prevent abuse and ensure availability for all users."
    status_check: >-
      GET https://report.netcraft.com/api/v3/submission/{uuid} returns pending or state
      (processing | no threats | suspicious | malicious), is_archived, classification_log,
      state_counts and submitter.email. GET /api/v3/submission/{uuid}/urls?count=1000 (with
      page, sort, url_state and url_takedown_state filters) returns per URL: url_state
      (processing | no threats | unavailable | malicious | rejected | suspicious),
      url_takedown_state (not injected | not started | in progress | resolved),
      incident_report_url, ip, country_code and url_classification_reason. The FAQ says:
      "By default, submissions will be archived after 30 days". After that the urls endpoint
      returns 404 "this submission has been archived". False positives go to POST
      /api/v3/report/mistake, and issues to POST /api/v3/submission/{uuid}/report_issue.
    rate_limits: >-
      No numbers are published, and going over returns HTTP 429. Up to 1000 URLs per
      submission. The site text says "Adding a small delay between requests should be
      sufficient". The FAQ says to contact support@netcraft.com for higher volumes, and that
      URLs may be rejected when there is "a particularly high volume of submissions on the
      same domain", so batch by domain.
    evidence_expected: >-
      url (required), a per-URL reason, country (the country the site is reachable from; use
      AU for geofenced kits) and an optional screenshot (base64; gif, png, jpg or jpeg; not
      allowed with no_submission). tags lists only "smishing". Credited types: phishing,
      phishing kit, fake shop, web shell and scam site URLs.
    terms_notes: >-
      Free. Anyone with the link, which contains the UUID only the submitter receives, can view
      the submission page, and the API returns submitter.email, so use a dedicated role mailbox.
      Anonymous reports get no credit. Free-mail reporters may not get result emails until they
      have made more than one submission. Email reports to scam@netcraft.com are treated the
      same as API reports. Netcraft's feed is used by many browsers, but it does not control
      their blocking. No API-specific terms of service were found.
    source:
      - https://report.netcraft.com/api/v3
      - https://report.netcraft.com/api/v3/api.json
      - https://report.netcraft.com/faqs

  - id: spamhaus_submission_portal
    name: Spamhaus Threat Intel Community Submission Portal API (beta)
    automated_ok: conditional
    verified: partial
    endpoint: https://submit.spamhaus.org/portal/api/v1/submissions/add/url
    other_endpoints:
      - POST https://submit.spamhaus.org/portal/api/v1/submissions/add/domain
      - POST https://submit.spamhaus.org/portal/api/v1/submissions/add/ip
      - GET https://submit.spamhaus.org/portal/api/v1/lookup/threats-types
      - GET https://submit.spamhaus.org/portal/api/v1/submissions/list
      - GET https://submit.spamhaus.org/portal/api/v1/submissions/count
    method: POST, application/json
    auth: >-
      HTTP header "Authorization: Bearer <token>". The token is created in the portal
      ("API Key Creation") and shown once. The free account is created by signing in with
      LinkedIn, Google or GitHub.
    payload_example: |
      {"threat_type": "<code from lookup/threats-types>", "reason": "Phishing page impersonating Australia Post (max 3,999 chars)", "source": {"object": "parcel-redelivery.example/au/track"}}
    status_check: >-
      GET submissions/list (paginated, items up to 10000) and GET submissions/count
      ({"total", "matched"}) cover submissions from the last 30 days. "matched" counts
      submissions found in one or more Spamhaus datasets.
    rate_limits: not published on the API page
    evidence_expected: threat_type code, reason (max 3,999 characters), source.object
    terms_notes: >-
      The portal is labelled BETA and is free. "Any domain, URL, IP etc submitted is not
      automatically listed in Spamhaus data sets." The terms (clause 6.3) give Spamhaus a
      licence to "distribute in any way we wish". UNVERIFIED: (1) whether lookup/threats-types
      has a phishing code for URLs or domains, since reading it needs a key; (2) how clause
      7.3.1 of the terms (no bots or other automated tools) applies to API use.
    source:
      - https://submit.spamhaus.org/api/
      - https://submit.spamhaus.org/faq/
      - https://submit.spamhaus.org/terms-conditions/

