lookups:
  - id: rdap_bootstrap_dns
    url: https://data.iana.org/rdap/dns.json
    verified: true
    notes: >-
      RFC 9224 format: services is a list of [[tlds], [base_urls]]. Publication was
      2026-10-28T22:00:04Z with 592 services. Append "domain/<name>". Examples: com ->
      https://rdap.verisign.com/com/v1/ ; au -> https://rdap.cctld.au/rdap/ ; top ->
      https://rdap.zdnsgtld.com/top/ ; xyz -> https://rdap.centralnic.com/xyz/ ; shop ->
      https://rdap.gmoregistry.net/rdap/ ; cc -> https://tld-rdap.verisign.com/cc/v1/ .
      NOT present on 2026-11-15: io, co, me, ws, nz. Cache the file and refresh it daily.
  - id: whois_fallback_missing_tlds
    url: "port 43: whois.nic.io (io), whois.registry.co (co), whois.nic.me (me)"
    verified: true
    notes: >-
      WHOIS servers taken from IANA root WHOIS (whois.iana.org) on 2026-11-15. rdap.org returns
      404 for these TLDs, because it only knows IANA-registered RDAP servers. Each registry's
      WHOIS terms were not reviewed.
  - id: rdap_bootstrap_ipv4
    url: https://data.iana.org/rdap/ipv4.json
    verified: true
    notes: >-
      The file contains both http and https bases; use https only:
      https://rdap.afrinic.net/rdap/ , https://rdap.apnic.net/ , https://rdap.arin.net/registry/ ,
      https://rdap.db.ripe.net/ , https://rdap.lacnic.net/rdap/ . Query <base>ip/<address>.
  - id: rdap_bootstrap_ipv6
    url: https://data.iana.org/rdap/ipv6.json
    verified: false
    notes: Expected to hold the same RIR bases (the content was not re-checked). Query <base>ip/<v6 address>.
  - id: rdap_bootstrap_asn
    url: https://data.iana.org/rdap/asn.json
    verified: false
    notes: ASN ranges mapped to RIRs (the content was not re-checked). Query <base>autnum/<asn>.
  - id: rdap_bootstrap_object_tags
    url: https://data.iana.org/rdap/object-tags.json
    verified: true
    notes: Published 2026-10-10. Maps entity handle suffix tags (e.g. ARIN) to RDAP servers.
  - id: iana_registrar_ids
    url: https://www.iana.org/assignments/registrar-ids/registrar-ids-1.csv
    verified: true
    notes: >-
      Columns: ID, Registrar Name, Status, RDAP Base URL. Example row:
      292,MarkMonitor Inc.,Accredited,https://rdap.markmonitor.com/rdap/
  - id: rdap_domain_registrar_abuse
    url: "<dns.json base>domain/<name>  (Accept: application/rdap+json)"
    verified: true
    notes: >-
      Live on rdap.verisign.com (google.com): the entity with roles [registrar] had handle "292"
      and publicIds [{type "IANA Registrar ID", identifier "292"}], and its nested entity with
      roles [abuse] had a vCard email abusecomplaints@markmonitor.com. The status values were
      RFC 8056 strings such as "client delete prohibited". Record status (e.g. "client hold",
      "server hold") and events to time takedowns.
  - id: rdap_ip_abuse
    url: "<ipv4/ipv6.json base>ip/<address>"
    verified: true
    notes: >-
      Walk entities recursively for the "abuse" role. Live checks: APNIC 1.1.1.1 had a top-level
      entity IRT-APNICRANDNET-AU with roles [abuse] and email helpdesk@apnic.net. ARIN 8.8.8.8 had
      registrant GOGL with a nested ABUSE5250-ARIN [abuse] entity, email network-abuse@google.com.
  - id: rdap_org_redirector
    url: https://rdap.org/domain/{name}
    verified: true
    notes: >-
      A redirector run by one person (Gavin Brown) "in my own time and at my own cost". Cloudflare
      limits it to 10 requests per 10 seconds (429), with 403 for abuse. It only knows
      IANA-registered servers, so it returns 404 for io, co and me. Use it as a fallback only.
  - id: au_rdap
    url: https://rdap.cctld.au/rdap/domain/{name}
    verified: partial
    notes: >-
      DO NOT automate. auDA WHOIS Policy 2025-11 (v1.2, 23 June 2026) clause 5.1(a) prohibits
      "use of WHOIS data to support an automated electronic query process", and clause 5.1(b)
      prohibits bulk access. Clause 5.2 says query limits apply to web, port 43 and RDAP. Clause
      4.4 says all email addresses were removed from port-43 and RDAP responses, although
      Schedule A lists the Registrar Abuse Contact Email. The live request from the test host on
      2026-11-15 returned HTTP 429 (Cloudflare error 1015).
  - id: cymru_dns_origin
    url: "<reversed IPv4 octets>.origin.asn.cymru.com TXT"
    verified: true
    notes: >-
      Free with no account. Answer format: "ASN | BGP prefix | CC | registry | allocated". Live
      results: 8.8.8.8 -> "15169 | 8.8.8.0/24 | US | arin | 2023-12-28" ; 1.1.1.1 -> "13335 |
      1.1.1.0/24 | AU | apnic | 2011-08-11". Data comes from 50+ BGP peers and refreshes every
      4 hours. The CC is registry data, not geolocation.
  - id: cymru_dns_origin6
    url: "<reversed IPv6 nibbles>.origin6.asn.cymru.com TXT"
    verified: true
    notes: 'Live: 2.0.0.b.0.6.8.4.1.0.0.2.origin6.asn.cymru.com -> "15169 | 2001:4860::/32 | US | arin | 2005-03-14".'
  - id: cymru_dns_asn
    url: "AS<asn>.asn.cymru.com TXT"
    verified: true
    notes: 'Live: AS15169 -> "15169 | US | arin | 2000-03-30 | GOOGLE - Google LLC, US".'
  - id: cymru_dns_peer
    url: "<reversed IPv4 octets>.peer.asn.cymru.com TXT"
    verified: true
    notes: 'Upstream peer ASNs, queried by IP. Live: 1.1.1.1 -> "2914 6461 23352 | 1.1.1.0/24 | AU | apnic | 2011-08-11".'
  - id: cymru_whois_bulk
    url: whois.cymru.com:43 (also v4.whois.cymru.com)
    verified: true
    notes: Bulk interface used with netcat. The page states "10k IPs / min" and "$0".
  - id: ripestat_network_info
    url: https://stat.ripe.net/data/network-info/data.json?resource={ip}&sourceapp={id}
    verified: true
    notes: >-
      Returns data.asns and data.prefix (live: 1.1.1.1 -> ["13335"], 1.1.1.0/24). "No limit on
      the amount of requests", but register with stat@ripe.net "if you plan to regularly do more
      than 1000 requests/day". At most 8 concurrent requests per IP. RIPEstat Service Terms apply.
  - id: ripestat_abuse_contact_finder
    url: https://stat.ripe.net/data/abuse-contact-finder/data.json?resource={ip|prefix|asn}&sourceapp={id}
    verified: true
    notes: Returns data.abuse_contacts and authoritative_rir (live 1.1.1.1 -> helpdesk@apnic.net, apnic). Cross-check it with RIR RDAP.
  - id: gsb_lookup_v4
    url: https://safebrowsing.googleapis.com/v4/threatMatches:find?key=API_KEY
    verified: partial
    notes: >-
      Deprecated: "The Safe Browsing APIs (v4) are deprecated", with no shutdown date found.
      Non-commercial only ("not for sale or revenue generating purposes"). Free, with a default
      quota allocated when the API is enabled. The request schema and 500-URL batch size were
      not re-verified in this check.
  - id: gsb_v5_hashes_search
    url: https://safebrowsing.googleapis.com/v5/hashes:search?key=API_KEY&hashPrefixes=<base64 prefix>
    verified: true
    notes: The v5 privacy-preserving lookup. Same non-commercial terms and API key. Lists via GET /v5/hashLists:batchGet.
  - id: gsb_v5_urls_search
    url: https://safebrowsing.googleapis.com/v5alpha1/urls:search?key=API_KEY&urls=<url>
    verified: true
    notes: Alpha (v5alpha1). "Clients MUST NOT send more than 50 URLs."
  - id: gsb_terms_for_blocklist
    url: https://developers.google.com/safe-browsing/terms
    verified: true
    notes: >-
      Terms last modified 2025-11-20. No commercial use without a separate agreement. Do not
      treat a URL from Google's list as unsafe ("such as by showing users a warning about the
      site or blocking access to it") unless the data was updated "within the past thirty
      minutes". The attribution line "Advisory provided by Google" is required by the
      Appropriate Usage page
      (https://developers.google.com/safe-browsing/reference/Appropriate.Usage). Do NOT copy
      Safe Browsing hits into the published DNS blocklist; use them only as a measurement signal.
  - id: web_risk_lookup
    url: https://webrisk.googleapis.com/v1/uris:search
    verified: true
    notes: >-
      The commercial alternative. uris.search is free for 0 to 100,000 calls a month, then $0.50
      per 1,000. threatLists.computeDiff is free, but calling it "changes the pricing of
      uris.search calls to the pricing of hashes.search calls": uris.search to confirm threats
      then costs $50.00 per 1,000.
  - id: phishtank_checkurl
    url: https://checkurl.phishtank.com/checkurl/
    verified: true
    notes: >-
      POST fields: url (urlencoded or base64), format (xml | php | json) and app_key (optional;
      much lower limits without it, and new keys cannot be obtained while registration is
      disabled). A descriptive User-Agent such as "phishtank/[username]" is required. Over the
      limit returns HTTP 509. Dumps: https://data.phishtank.com/data/online-valid.{xml,csv,json}[.gz|.bz2];
      without a key, "a few downloads per day".
  - id: urlscan_search
    url: https://urlscan.io/api/v1/search/?q=domain:<domain>
    verified: partial
    notes: The free plan allows 1,000 searches a day. Search before scanning again. Search scope on the free plan (public scans only) was not re-verified.

obligations:
  - id: icann_raa_3_18_2024
    applies_to: ICANN-accredited registrars (gTLDs)
    effective: "2024-04-05 (2024 Amendment Effective Date)"
    verified: true
    summary: >-
      3.18.1: keep an abuse contact and publish an email address or webform on, or readily
      accessible from, the home page. Confirm receipt to the reporter, and take "reasonable and
      prompt steps to investigate". DNS Abuse means malware, botnets, phishing, pharming, and spam
      used to deliver them. 3.18.2: with actionable evidence, "promptly take the appropriate
      mitigation action(s)". 3.18.3: a 24/7 contact for reports of Illegal Activity. 3.18.4:
      publish the procedures and keep records for the shorter of 2 years or the legal maximum.
    source: https://itp.cdn.icann.org/en/files/accredited-registrars/registrar-accreditation-agreement-global-amendment-05apr24-en.htm
  - id: icann_registry_spec6_s4
    applies_to: gTLD registry operators
    effective: "2024-04-05"
    verified: true
    summary: >-
      The 2024 amendments also oblige registry operators to mitigate well-evidenced DNS Abuse
      (Base Registry Agreement Specification 6, Section 4). To escalate, report to the
      registrar first, wait "a reasonable time", then use the ICANN "abuse involving a domain
      name" complaint form. ICANN publishes monthly DNS Abuse enforcement reports.
    source:
      - https://www.icann.org/dnsabuse
      - https://www.icann.org/compliance/complaint
  - id: icann_rdap
    applies_to: gTLD registries and registrars
    verified: partial
    summary: >-
      RDAP is the definitive source of gTLD registration data "As of 28 January 2025" (verified).
      The researcher's claims that RDAP Response Profile v2.2 makes an abuse entity with tel and
      email mandatory, and that WHOIS exceptions exist for .com, .name and .post, were NOT
      re-verified (the PDF could not be text-extracted, and the announcement does not mention
      exceptions). Live .com data is consistent with the abuse-entity claim.
    source:
      - https://www.icann.org/en/announcements/details/icann-update-launching-rdap-sunsetting-whois-27-01-2025-en
      - https://itp.cdn.icann.org/en/files/registry-operators/rdap-response-profile-21feb24-en.pdf
  - id: auda_registrar_agreement_2025
    applies_to: .au registrars (ccTLD, not under the ICANN RAA)
    verified: true
    summary: >-
      2025 Registrar Agreement (dated 06 December 2024), clause 14.8. In (a), auDA and the
      registrar nominate a "DNS Abuse Contact" in Schedule 1 as the "primary point of contact
      between auDA and the Registrar" for malicious conduct in .au. In (c), if the registrar
      receives a report of DNS Abuse "via the DNS Abuse Contact", it must confirm receipt to the
      reporter and investigate, and with actionable evidence "must promptly take appropriate
      mitigation action". DNS Abuse has the same definition as ICANN's. It is UNCONFIRMED
      whether a public reporter can use that contact, so do not rely on citing 14.8(c).
    source: https://files.auda.org.au/documents/2025-Registrar-Agreement.pdf
  - id: auda_whois_policy_2025_11
    applies_to: anyone querying .au WHOIS or RDAP
    verified: true
    summary: >-
      WHOIS Policy 2025-11 (v1.1 approved 5 Feb 2026; v1.2 dated 23 June 2026). Clause 2.1: the
      WHOIS service is provided via web, port 43 and RDAP. Clause 5.1 "strictly prohibit[s]":
      (a) "use of WHOIS data to support an automated electronic query process" and (b) bulk
      access. Clause 5.2: query-number restrictions on web, port 43 and RDAP. Clause 4.4: all
      email addresses were removed from port-43 and RDAP responses.
    source:
      - https://www.auda.org.au/au-domain-names/au-rules-and-policies/whois-policy-2025-11/
      - https://files.auda.org.au/documents/WHOIS-Policy-June-2026.pdf

uncertain:
  - Spamhaus portal - whether there is a phishing threat_type code for URL and domain submissions, and whether scripted API use is consistent with terms clause 7.3.1.
  - Cloudflare - the {report_param} values, and whether the entitlement is granted to non-Enterprise accounts.
  - Netcraft - numeric rate limits, the 401/403 triggers, and the meaning of the undefined BearerAuth on /tags/*.
  - urlscan.io - that unlisted scans are visible to urlscan Pro users (from a search extract, not read directly); the polling cadence and the customagent and referer field names.
  - Google Safe Browsing - the v4 shutdown date, default quota numbers, and whether the report form has a CAPTCHA.
  - ICANN RDAP Response Profile v2.2 abuse-entity wording, and the WHOIS-sunset exceptions for .com, .name and .post.
  - auDA - whether WHOIS Policy 2025-11 is already in force; whether .au RDAP returns a registrar abuse email; the RDAP query limit; public access to the registrar DNS Abuse Contact; the auDA complaints route under the Licensing Rules.
  - Microsoft Graph urlThreatSubmission - licence requirements, and whether it feeds global SmartScreen.
  - RDAP availability for the io, co and me registries outside the IANA bootstrap.
  - The content of ipv6.json and asn.json was not re-checked in this pass.
