# CyberCheck - where to report phishing that targets Australian brands and Australians
# Fact-checked 2026-11-15 against the official pages named in each `source`.
# Rule: an entry is listed only if its address or URL was seen on the brand's or agency's own
# official page during this check. automated_ok is true only where the channel itself
# explicitly supports machine-to-machine submission.
#
# NOT listed on purpose (could not be confirmed on an official page on 2026-11-15; see the .md):
#   - DHL Australia phishing@dhl.com (dhl.com did not load; seen only in a search-engine summary;
#     DHL's global leaflet uses phishing-dpdhl@dhl.com)
#   - PayPal phishing@paypal.com.au (paypal.com/au/security page returned 403; the AU help page shows phishing@paypal.com, listed below)
#   - ubank phish@nab.com.au / phish@ubank.com.au (ubank pages returned 403 or did not load)
#   - AGL spam@agl.com.au (no official page found)
#   - report@phishing.gov.au and report@cyber.gov.au (no evidence they exist)
#   - assist@asd.gov.au (appears only as a hidden page-feedback field on cyber.gov.au, not as a reporting channel)
#   - Westpac vulnerability@westpac.com.au (not on the cited page)
channels:
  # ---------------- GOVERNMENT ----------------
  - id: scamwatch-report-website
    name: Scamwatch - Report a scam website (National Anti-Scam Centre, ACCC)
    scope: government
    brand_id: null
    method: web_form
    address_or_url: https://forms.scamwatch.gov.au/report-a-scamwebsite/
    automated_ok: false
    source: https://www.scamwatch.gov.au/report-a-scam
    notes: "Reached from the Scamwatch report page under 'Are you reporting a website?' (answer No to money stolen and No to investment scam). The page says 'We're testing ways to make it quicker and easier to report a scam. Help us take down scam websites from social media and search results.' Two required fields: Website URL and 'What makes the website a scam?'. The form warns that the ACCC may share the text with partner agencies and organisations and that you must not include personal details. Google reCAPTCHA plus a 'Leave this field blank' honeypot. Nothing about bulk, API or rate limits. Manual only."
  - id: scamwatch-report
    name: Scamwatch - Report a scam (full form)
    scope: government
    brand_id: null
    method: web_form
    address_or_url: https://portal.scamwatch.gov.au/report-a-scam/
    automated_ok: false
    source: https://www.scamwatch.gov.au/report-a-scam
    notes: "Steps: Introduction, About the scam, About you, Preview & submit, Complete. 'We can't respond to reports made through this form.' Not a police report. Asks for scam details, contact details, times and screenshots or attachments. With consent, reports are used to 'work with organisations and remove scam websites, scam ads and contact details'. Manual only."
  - id: nasc-enquiry
    name: National Anti-Scam Centre - business/government enquiry (ask about data sharing)
    scope: government
    brand_id: null
    method: web_form
    address_or_url: https://forms.scamwatch.gov.au/contact-us/
    automated_ok: false
    source: https://www.nasc.gov.au/what-we-do/contact-us
    notes: "Not a reporting channel: the form says 'Do not report a scam through this form' and 'we can't respond to everyone'. Reason options include 'Make a business, government or other enquiry'. Use it only to ask whether CyberCheck could join a data-sharing arrangement. The NASC runs a scam website takedown service covering phishing and online shopping scams (https://www.nasc.gov.au/what-we-do/disruption), using a third-party takedown provider. Takedowns: 5,834 sites in Q1 2026 (https://www.nasc.gov.au/news/thousands-of-scam-websites-taken-down-as-online-scams-continue-to-cost-australians); in 2025, over 8,400 websites sent for assessment and over 7,500 scam URLs removed (https://www.nasc.gov.au/news/continued-action-critical-to-combat-fraud-as-annual-scam-losses-exceed-2-billion). It receives automated data from ReportCyber and regular data from AFCX, and is building a system that will 'receive a report of a scam from any institution or individual' (https://www.nasc.gov.au/what-we-do/collaboration). No published eligibility rules, API or onboarding process."
  - id: asic-impersonation
    name: ASIC - report a scam impersonating ASIC
    scope: government
    brand_id: asic
    method: web_form
    address_or_url: https://www.asic.gov.au/about-asic/contact-us#online
    automated_ok: false
    source: https://www.asic.gov.au/regulatory-resources/scams/scams-impersonating-asic
    notes: "Only for ASIC impersonation: 'sending us an online inquiry with details and/or an attachment of the suspicious communication'. Phone 1300 300 630. ASIC's own takedown service (investment scam and phishing websites and ads, https://www.asic.gov.au/regulatory-resources/scams/asic-s-website-takedown-capability) has no public intake. Moneysmart (last updated 11 Sep 2026) says 'Report all scams, including investment scams, to Scamwatch' and reports 19,400 removals in FY2025/26 (https://moneysmart.gov.au/check-and-report-scams/report-an-investment-scam)."
  - id: reportcyber
    name: ReportCyber (ASD's ACSC with police) - report a cybercrime
    scope: government
    brand_id: null
    method: web_form
    address_or_url: https://reportapp.cyber.gov.au/
    automated_ok: false
    source: https://www.cyber.gov.au/submit-a-report
    notes: "For victims (people and organisations) reporting a cybercrime to police ('our joint tool, ReportCyber', https://www.cyber.gov.au/guidance/help-during-a-cybercrime). Hotline 1300 CYBER1 (1300 292 371). The old URL https://www.cyber.gov.au/report-and-recover/report now redirects to /submit-a-report. The app refuses browsers it does not support. Not meant for third-party phishing-URL takedown. The NASC gets ReportCyber data automatically."
  - id: acsc-incident
    name: ASD's ACSC - Report a cyber security incident
    scope: government
    brand_id: null
    method: web_form
    address_or_url: https://www.cyber.gov.au/report-a-cyber-security-incident
    automated_ok: false
    source: https://www.cyber.gov.au/report-a-cyber-security-incident
    notes: "Published 17 Jun 2026. 'Submit a cyber security incident report for large organisations, government or critical infrastructure', including mandatory reporting under SOCI and telecommunications security rules. Not for phishing aimed at other people."
  - id: asd-ctis
    name: ASD Cyber Threat Intelligence Sharing (CTIS)
    scope: government
    brand_id: null
    method: api
    address_or_url: https://partners.cyber.gov.au
    automated_ok: true
    source: https://www.cyber.gov.au/blog/join-the-cyber-threat-intelligence-sharing-service-through-sentinel-or-splunk-enterprise-security
    notes: "NOT AVAILABLE TO CYBERCHECK UNLESS MEMBERSHIP IS APPROVED. CTIS is 'a two-way sharing platform that enables government and industry partners to receive and share information about malicious cyber activity at machine speed', with Microsoft Sentinel and Splunk ES plugins. The blog was last reviewed 24 Mar 2024. 'To join CTIS, you need to be an ASD Cyber Security Network Partner.' Network Partner eligibility (page published 22 Jun 2026, https://www.cyber.gov.au/become-a-partner/become-an-asd-network-partner): 'registered businesses with IT security capabilities, government and security agencies, and academic or not-for-profit institutions'. The application asks for an ABN and SOC/IR details. FY2025-26: over 550 CTIS partners and over 1 million IOCs shared (https://www.cyber.gov.au/publication/annual-cyber-threat-report-2025-26/year-in-review). partners.cyber.gov.au is the partner portal linked from cyber.gov.au. Indicator format, volume and rate limits are not published."
  - id: acma-spam
    name: ACMA spam forwarding (email; SMS to 0429 999 888)
    scope: government
    brand_id: null
    method: email
    address_or_url: report@submit.spam.acma.gov.au
    automated_ok: false
    source: https://www.acma.gov.au/dealing-with-spam
    notes: "Only useful when an actual spam message was received; not for domains found in CT logs. Forward spam without editing it or the subject line; SMS to 0429 999 888 (standard charges). This 'is not a complaint'. ACMA collects the forwarding address or number. ACMA sends scams to Scamwatch (https://www.acma.gov.au/phone-and-sms-scams). The SMS Sender ID Register started on 1 July 2026 (https://ministers.treasury.gov.au/ministers/daniel-mulino-2025/media-releases/albanese-government-steps-industry-protections-stop)."
  - id: afcx
    name: Australian Financial Crimes Exchange (AFCX) - membership enquiry
    scope: government
    brand_id: null
    method: web_form
    address_or_url: https://www.afcx.com.au/contact-us/
    automated_ok: false
    source: https://www.afcx.com.au/
    notes: "An industry body, not a government agency; listed here because it shares data with the NASC. 'The AFCX is open to organisations involved in financial transactions - such as banking, financing, insurance, superannuation, public utilities and telcommunication providers.' Members only; no route for researchers or the public. The homepage 'submit your interest' form was not rendering on 2026-11-15 (raw shortcode shown). The NASC joined the AFCX intel loop in June 2024 to share scam phone numbers, URLs and bank accounts (https://ministers.treasury.gov.au/ministers/stephen-jones-2022/media-releases/government-joins-cutting-edge-intel-tool-fight-scammers)."
  # ---------------- REGISTRY (.au) ----------------
  - id: au-registrar-abuse
    name: Registrar of record abuse contact (.au)
    scope: registry
    brand_id: null
    method: email
    address_or_url: "Registrar Abuse Contact Email shown by a manual web lookup at https://whois.auda.org.au/ (CAPTCHA). Port 43 and RDAP responses carry no email addresses."
    automated_ok: false
    source: https://files.auda.org.au/documents/au-Licensing-Rules-July-2026.pdf
    notes: "Licensing Rules (amended 23 June 2026): 3.4.1 says the complaint goes to the Registrar of Record, about Registrant or Registrar obligations under the auDA Rules, in the form the registrar requires. 3.4.4: the registrar has 30 calendar days unless it gives a new timeframe (3.4.5). 3.4.6: written decision with appeal right. Grounds: 2.11.16 (illegal or fraudulent use) and 2.11.17 (DNS Abuse, defined to include phishing). 2.16.3 lets auDA or a registrar suspend or cancel. WHOIS Schedule A discloses 'Registrar Abuse Contact Email/Phone', but WHOIS Policy 4.4 says email addresses were removed from Port 43 and RDAP responses (https://files.auda.org.au/documents/2025-11-WHOIS-Policy.pdf). Rule 2.18.14 and WHOIS Policy 5.1 prohibit automated query processes and bulk access. The WHOIS terms also forbid 'aggregating, collecting or compiling' WHOIS data. Registrar list: https://www.auda.org.au/registrar-resources/list-of-au-accredited-registrars/"
  - id: auda-complaint
    name: auDA complaint (after the registrar of record)
    scope: registry
    brand_id: null
    method: web_form
    address_or_url: https://www.auda.org.au/au-domain-names/complaints-and-disputes/au-complaints/submit-a-complaint/
    automated_ok: false
    source: https://www.auda.org.au/au-domain-names/complaints-and-disputes/au-complaints/submit-a-complaint/
    notes: "Covers (1) licences where the registrant may not meet eligibility or allocation rules (for example a lookalike registered with a false or borrowed ABN) and (2) registrar conduct. 'All complaints must first be lodged with the registrar of record.' Valid contact details are required, and an upheld complaint never transfers the domain to you. The page sends scams to Scamwatch, website content to ACMA, hosting issues to the host and IP disputes to auDRP. Formally this is a review of the registrar's decision under Licensing Rules 3.5.1. auDA can also act at the request of an Enforcement Body or Intelligence Agency (Rule 2.11.19)."
  - id: auda-dns-abuse-enquiry
    name: auDA general enquiry - report suspected DNS abuse
    scope: registry
    brand_id: null
    method: web_form
    address_or_url: https://www.auda.org.au/about-auda/contact-us/general-enquiry-form/
    automated_ok: false
    source: https://www.auda.org.au/au-domain-names/manage-your-au-domain-name/keep-your-au-secure/
    notes: "The keep-secure page says: 'To get in touch with us, including to report a suspected instance of DNS abuse, submit a general enquiry.' The form page itself says it 'should not be used to lodge domain or industry complaints', so describe the case as a DNS abuse report. auDA does daily checks against DNS abuse threat-intelligence feeds (25 daily feeds per the CEO blog of 10 Aug 2026, https://www.auda.org.au/news-insights/blog/from-the-ceo-uplifting-australian-and-global-scam-prevention/). auDA publishes general@auda.org.au as its general contact (WHOIS Policy cover page). No published researcher, trusted-notifier or zone-file access program."
