  method_note: "Measured ratios: .com 26.1, .org 37.0, .top 172.6 bytes per registered domain. Opt-out TLDs are estimated at 26-37 B/domain; non-opt-out TLDs (.top, .live, .life, .mobi; DNS check of NSEC3 flags on 2026-11-15) at about .top's ratio. Registered counts include names not in the zone, so real files may be smaller. Confirm with HEAD Content-Length after approval. Phase 1+2 total is about 2.6 GB/day; com+net+org add about 5.3 GB/day."
