# CyberCheck Australian brand watchlist. Fact-checked 2026-11-15 (see au-watchlist.md).
#
# official_domains: registrable domains confirmed by at least one of:
#   - the auDA registry (registrant name/ABN), from the earlier researcher's saved lookups;
#   - registrar RDAP registrant organisation (.com/.net);
#   - an OV/EV TLS certificate whose subject organisation is the brand or its parent (checked 2026-11-15);
#   - the brand's own security or support page naming the domain;
#   - the brand's live primary website (the weakest evidence; noted in au-watchlist.md).
# uncertain_domains: plausible but not confirmed (redirect-only, shared nameservers, DV-only certificate,
#   or a privacy-proxied registrant). Use them to lower a score or send to human review. Never hard-allowlist them.
# Suffix allowlist, separate from this list: any host under .gov.au, and any host under the brand TLDs
#   .anz .auspost .cba .commbank .netbank .nab .ubank (IANA root DB, checked 2026-11-15).
# qld.gov.au, sa.gov.au, tas.gov.au, vic.gov.au and wa.gov.au are public suffixes in the PSL, so they are
#   not listed as registrable domains. nsw.gov.au is not a public suffix. The .gov.au suffix rule covers all of them.
